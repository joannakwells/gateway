[project]
name = "gateway-instagram-content-crew"
version = "0.1.0"
description = "Gateway Garden Center-specific CrewAI workflow for Instagram content strategy, copy, visuals, and QA."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "crewai>=0.152.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
gateway-instagram = "gateway_instagram_content_crew.main:run_interactive"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.crewai]
type = "crew"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "C4", "ARG"]
ignore = ["E501"]

[tool.pyright]
useLibraryCodeForTypes = true
exclude = [".venv", ".cache"]
